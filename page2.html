<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2. TLS 핸드쉐이크 상세 (타임라인)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
<div class="container mx-auto px-6 py-16">
    <h1 class="text-4xl font-bold mb-8 text-center">2. TLS 핸드쉐이크 상세</h1>

    <!-- Timeline Container -->
    <div class="flex items-center justify-between space-x-4">
        <!-- Step 1 -->
        <div class="flex-shrink-0 bg-white p-6 rounded-lg shadow-lg text-center w-1/4">
            <h2 class="font-semibold mb-2">ClientHello</h2>
            <p>암호화 방식 제안</p>
        </div>

        <!-- Arrow -->
        <div class="w-8 text-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 mx-auto text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
        </div>

        <!-- Step 2 -->
        <div class="flex-shrink-0 bg-white p-6 rounded-lg shadow-lg text-center w-1/4">
            <h2 class="font-semibold mb-2">ServerHello</h2>
            <p>서버 인증서 포함</p>
        </div>

        <!-- Arrow -->
        <div class="w-8 text-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 mx-auto text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
        </div>

        <!-- Step 3 -->
        <div class="flex-shrink-0 bg-white p-6 rounded-lg shadow-lg text-center w-1/4">
            <h2 class="font-semibold mb-2">Key Exchange</h2>
            <p>공개키 기반 암호화</p>
        </div>

        <!-- Arrow -->
        <div class="w-8 text-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 mx-auto text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
        </div>

        <!-- Step 4 -->
        <div class="flex-shrink-0 bg-white p-6 rounded-lg shadow-lg text-center w-1/4">
            <h2 class="font-semibold mb-2">Finished</h2>
            <p>암호화된 세션 시작</p>
        </div>
    </div>

    <!-- 돌아가기 -->
    <div class="text-center mt-12">
        <a href="/" class="text-blue-600 hover:underline">&larr; 메인 페이지로 돌아가기</a>
    </div>
</div>
</body>
</html>
