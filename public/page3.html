<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3. OpenSSL 실습</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
<div class="container mx-auto px-6 py-16">
    <h1 class="text-4xl font-bold mb-6">3. OpenSSL 실습</h1>
    <p class="text-lg mb-4">아래 명령어를 통해 TLS 서버와 클라이언트를 직접 구성해볼 수 있습니다.</p>
    <pre class="bg-gray-800 text-green-400 font-mono p-6 rounded-lg overflow-auto">
# 서버: 인증서 생성 및 서버 실행
openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem -days 365 -nodes
openssl s_server -key key.pem -cert cert.pem -port 4433

# 클라이언트: 서버에 접속
openssl s_client -connect [서버 IP]:4433
    </pre>
    <a href="/" class="inline-block mt-8 text-blue-600 hover:underline">← 메인 페이지로 돌아가기</a>
</div>
</body>
</html>
