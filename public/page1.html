<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1. TLS란 무엇인가?</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
<div class="container mx-auto px-6 py-16">
    <h1 class="text-4xl font-bold mb-6">1. TLS란 무엇인가?</h1>
    <p class="text-lg mb-4">
        TLS(Transport Layer Security)는 인터넷에서 데이터를 암호화하여 안전하게 전송하기 위한 프로토콜입니다.
        브라우저와 서버 간의 통신을 보호하며, 개인정보 노출을 방지합니다.
    </p>
    <p class="text-lg">
        TLS는 인증(Authentication), 암호화(Encryption), 무결성(Integrity)을 통해 보안을 보장합니다.
    </p>
    <a href="/" class="inline-block mt-8 text-blue-600 hover:underline">← 메인 페이지로 돌아가기</a>
</div>
</body>
</html>
